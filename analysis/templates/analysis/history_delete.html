{% load static %}
<!doctype html>
<html lang="{{ text.html_lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ text.delete_analysis_heading }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-4 py-md-5">
        <header class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between gap-3 mb-5 mx-auto" style="max-width: 1120px;">
            <div class="d-inline-flex align-items-center gap-3">
                {% include 'analysis/partials/account_drawer.html' %}
                <a class="d-inline-flex align-items-center" href="{% url 'analysis:input' %}?lang={{ language }}" aria-label="FitGap">
                    <img src="{% static 'analysis/fitgap-logo.svg' %}" alt="FitGap - AI Skill-Gap Analysis" class="img-fluid" style="width: clamp(180px, 48vw, 315px);">
                </a>
            </div>
            <nav class="small d-flex gap-3 align-items-center" aria-label="Language selection">
                <a href="{% url 'analysis:analysis_history_delete' item.record.id %}?lang=en" class="{% if language == 'en' %}fw-bold text-dark{% endif %}"{% if language == 'en' %} aria-current="page"{% endif %}>English</a>
                <a href="{% url 'analysis:analysis_history_delete' item.record.id %}?lang=zh" class="{% if language == 'zh' %}fw-bold text-dark{% endif %}"{% if language == 'zh' %} aria-current="page"{% endif %}>简体中文</a>
            </nav>
        </header>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <section class="p-4 bg-white border rounded-3">
                    <h1 class="h3 fw-bold mb-3">{{ text.delete_analysis_heading }}</h1>
                    <p class="text-muted">{{ text.delete_analysis_warning }}</p>
                    <p class="fw-semibold">{{ item.title }}</p>
                    <div class="d-flex flex-column flex-sm-row gap-2">
                        <form method="post" action="{% url 'analysis:analysis_history_delete' item.record.id %}?lang={{ language }}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">{{ text.delete_analysis_button }}</button>
                        </form>
                        <a href="{% url 'analysis:analysis_history_detail' item.record.id %}?lang={{ language }}" class="btn btn-outline-secondary">{{ text.cancel }}</a>
                    </div>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
